# auto-dsh-our-free-model bundle patch (fork of dsh-our-free-model).
#
# 一行 insert 即挂载 Host 半身；浏览器半身由 package.json 的 dsh.client 声明，
# 并绑定在 name 为裸包名的这一行上（子路径行不会携带半身）。
# 注意：name 必须与 package.json 的 name 完全一致，否则浏览器半身不挂载。
- insert:
    - id: our-free-model
      name: 'auto-dsh-our-free-model'
      config: {}
